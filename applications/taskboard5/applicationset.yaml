apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: taskboard5-addons-prod
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - name: backups
      - name: postgres
  template:
    metadata:
      name: addon-{{name}}-prod
    spec:
      project: default
      source:
        repoURL: https://github.com/ika100-demo/taskboard5-gitops
        targetRevision: main
        path: applications/taskboard5/addons/prod/{{name}}
      destination:
        server: https://kubernetes.default.svc
        namespace: taskboard5-prod
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
