apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: taskboard5-dev
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - name: taskboard5-api
      - name: taskboard5-web
  template:
    metadata:
      name: '{{name}}-dev'
    spec:
      project: default
      source:
        repoURL: https://github.com/ika100-demo/taskboard5-gitops
        targetRevision: main
        path: applications/taskboard5/overlays/dev/{{name}}
      destination:
        server: https://kubernetes.default.svc
        namespace: taskboard5-dev
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
---
