apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskboard5-api
  labels:
    app: taskboard5-api
    app.kubernetes.io/name: taskboard5-api
    app.kubernetes.io/part-of: taskboard5
    app.kubernetes.io/managed-by: gitops-app
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: kube-system
  hostnames:
  - taskboard5-api.taskboard5-dev.localhost
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: taskboard5-api
      port: 80
